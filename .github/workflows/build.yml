name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew
      - name: Clean build and test
        run: ./gradlew clean build --no-daemon --warning-mode all
      - name: Store build configuration
        run: ./gradlew build --no-daemon --warning-mode all
      - name: Verify configuration cache reuse
        run: ./gradlew build --no-daemon --warning-mode all
      - name: Build optional WorldEdit adapter
        run: ./gradlew :worldedit-adapter:build --no-daemon --warning-mode all
