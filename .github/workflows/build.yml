name: Build

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: guardian-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test publishing checks
        run: python -m unittest discover -s scripts/tests -v
      - run: chmod +x gradlew
      - name: Build and test Fabric, NeoForge and optional WorldEdit adapter
        run: ./gradlew build --no-daemon --warning-mode all --max-workers=2 --no-parallel
      - name: Verify configuration cache reuse
        shell: bash
        run: python scripts/verify_configuration_cache.py
