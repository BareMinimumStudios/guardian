name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Destination (select one to retry a partial failure)
        required: true
        default: github
        type: choice
        options: [github, modrinth, curseforge, all]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || inputs.target != 'modrinth'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_type: ${{ steps.release.outputs.release_type }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew build --no-daemon --warning-mode all --max-workers=2 --no-parallel
      - name: Verify artifacts and extract release notes
        id: release
        shell: python
        run: |
          from pathlib import Path
          import json, os, shutil, zipfile, sys
          sys.path.insert(0, 'scripts')
          from prepare_modrinth import prepare, release_type
          props = dict(line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines() if '=' in line and not line.startswith('#'))
          version = props['modVersion']
          kind = release_type(version.split('+', 1)[0])
          tag = 'v' + (version.split('+', 1)[0] if kind == 'release' else version)
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != tag:
              raise SystemExit('Tag must match modVersion: ' + tag)
          dest = Path('build/release')
          dest.mkdir(parents=True, exist_ok=True)
          bundle = Path('build/modrinth')
          entries = prepare(Path('.'), bundle, '1.21.1', version.split('+', 1)[0])
          shutil.copy2(bundle / '1.21.1' / 'RELEASE-NOTES.md', dest / 'RELEASE-NOTES.md')
          for entry in entries:
              shutil.copy2(bundle / '1.21.1' / entry['file'], dest / entry['file'])
          adapter = Path('worldedit-adapter/build/libs') / ('guardian-worldedit-' + version + '.jar')
          with zipfile.ZipFile(adapter) as archive:
              meta = json.loads(archive.read('fabric.mod.json'))
              if (meta.get('id'), meta.get('version'), meta.get('environment')) != ('guardian-worldedit', version, 'server'):
                  raise SystemExit('Invalid WorldEdit runtime metadata')
          shutil.copy2(adapter, dest / ('guardian-worldedit-' + version + '-fabric.jar'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\ntag=' + tag + '\n')
              output.write('release_type=' + kind + '\nprerelease=' + str(kind != 'release').lower() + '\n')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guardian-release
          path: build/release/*
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'all'
        with:
          name: guardian-modrinth-build-1.21.1
          path: build/modrinth/
          if-no-files-found: error

  github:
    needs: build
    if: github.event_name == 'push' || inputs.target == 'github' || inputs.target == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: guardian-release
          path: build/release
      - uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.build.outputs.tag }}
          github-commitish: ${{ github.sha }}
          github-prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          name: Guardian ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.release_type }}
          files: build/release/*.jar
          changelog-file: build/release/RELEASE-NOTES.md
          java: '21'
          fail-mode: fail

  modrinth:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.target == 'modrinth' || (inputs.target == 'all' && needs.build.result == 'success')) }}
    uses: ./.github/workflows/modrinth.yml
    with:
      dry_run: false
      shared_base_artifact: ${{ inputs.target == 'all' }}
    secrets: inherit

  curseforge:
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'curseforge' || inputs.target == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: guardian-release
          path: build/release
      - name: Check CurseForge configuration
        env:
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: test -n "$PROJECT_ID" && test -n "$TOKEN"
      - uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: ${{ needs.build.outputs.version }}-fabric
          version: ${{ needs.build.outputs.version }}-fabric
          version-type: ${{ needs.build.outputs.release_type }}
          files: build/release/guardian-${{ needs.build.outputs.version }}-fabric.jar
          changelog-file: build/release/RELEASE-NOTES.md
          loaders: fabric
          environment: server
          game-versions: '1.21.1'
          java: '21'
          dependencies: |
            fabric-api(required){modrinth:fabric-api}{curseforge:fabric-api}
            fabric-language-kotlin(required){modrinth:fabric-language-kotlin}{curseforge:fabric-language-kotlin}
            fzzy-config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
          fail-mode: fail

  curseforge-neoforge:
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'curseforge' || inputs.target == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: guardian-release
          path: build/release
      - name: Check CurseForge configuration
        env:
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: test -n "$PROJECT_ID" && test -n "$TOKEN"
      - uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: ${{ needs.build.outputs.version }}-neoforge
          version: ${{ needs.build.outputs.version }}-neoforge
          version-type: ${{ needs.build.outputs.release_type }}
          files: build/release/guardian-${{ needs.build.outputs.version }}-neoforge.jar
          changelog-file: build/release/RELEASE-NOTES.md
          loaders: neoforge
          environment: server
          game-versions: '1.21.1'
          java: '21'
          dependencies: |
            kotlin-for-forge(required){modrinth:kotlin-for-forge}{curseforge:kotlin-for-forge}
            fzzy-config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
          fail-mode: fail
