name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Destination (select one to retry a partial failure)
        required: true
        default: github
        type: choice
        options: [github, modrinth, curseforge, all]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew clean build --no-daemon --warning-mode all
      - name: Verify artifacts and extract release notes
        id: release
        shell: python
        run: |
          from pathlib import Path
          import json, os, re, shutil, zipfile
          props = dict(line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines() if '=' in line and not line.startswith('#'))
          version = props['modVersion']
          tag = 'v' + version
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != tag:
              raise SystemExit('Tag must match modVersion: ' + tag)
          text = Path('CHANGELOG.md').read_text()
          heading = re.search(r'^## \[' + re.escape(version) + r'\] - \d{4}-\d{2}-\d{2}\s*$', text, re.M)
          if not heading:
              raise SystemExit('Missing dated changelog section for ' + version)
          notes = re.split(r'^## |^\[Unreleased\]:', text[heading.end():], maxsplit=1, flags=re.M)[0].strip()
          if not notes:
              raise SystemExit('Release notes must not be empty')
          dest = Path('build/release')
          dest.mkdir(parents=True, exist_ok=True)
          (dest / 'RELEASE-NOTES.md').write_text(notes + '\n')
          for folder, mod_id, name in [('build/libs', 'guardian', 'guardian'), ('worldedit-adapter/build/libs', 'guardian-worldedit', 'guardian-worldedit')]:
              matches = []
              for jar in Path(folder).glob('*.jar'):
                  if jar.name.endswith('-sources.jar') or jar.name.endswith('-dev.jar'):
                      continue
                  with zipfile.ZipFile(jar) as archive:
                      if 'fabric.mod.json' not in archive.namelist():
                          continue
                      meta = json.loads(archive.read('fabric.mod.json'))
                      if meta.get('id') == mod_id and meta.get('version') == version and meta.get('environment') == 'server':
                          matches.append(jar)
              if len(matches) != 1:
                  raise SystemExit('Expected one runtime artifact for ' + mod_id + ': ' + str(matches))
              shutil.copy2(matches[0], dest / (name + '-' + version + '-fabric.jar'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\ntag=' + tag + '\n')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guardian-release
          path: build/release/*
          if-no-files-found: error

  github:
    needs: build
    if: github.event_name == 'push' || inputs.target == 'github' || inputs.target == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: guardian-release
          path: build/release
      - uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.build.outputs.tag }}
          github-commitish: ${{ github.sha }}
          github-prerelease: true
          name: Guardian ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          version-type: alpha
          files: build/release/*-fabric.jar
          changelog-file: build/release/RELEASE-NOTES.md
          java: '21'
          fail-mode: fail

  modrinth:
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'modrinth' || inputs.target == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: guardian-release
          path: build/release
      - name: Check Modrinth configuration
        env:
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: test -n "$PROJECT_ID" && test -n "$TOKEN"
      - uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: ${{ needs.build.outputs.version }}-fabric
          version: ${{ needs.build.outputs.version }}-fabric
          version-type: alpha
          files: build/release/guardian-${{ needs.build.outputs.version }}-fabric.jar
          changelog-file: build/release/RELEASE-NOTES.md
          loaders: fabric
          environment: server
          game-versions: '1.21.1'
          java: '21'
          dependencies: |
            fabric-api(required){modrinth:fabric-api}{curseforge:fabric-api}
            fabric-language-kotlin(required){modrinth:fabric-language-kotlin}{curseforge:fabric-language-kotlin}
            fzzy-config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
          fail-mode: fail

  curseforge:
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'curseforge' || inputs.target == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: guardian-release
          path: build/release
      - name: Check CurseForge configuration
        env:
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: test -n "$PROJECT_ID" && test -n "$TOKEN"
      - uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: ${{ needs.build.outputs.version }}-fabric
          version: ${{ needs.build.outputs.version }}-fabric
          version-type: alpha
          files: build/release/guardian-${{ needs.build.outputs.version }}-fabric.jar
          changelog-file: build/release/RELEASE-NOTES.md
          loaders: fabric
          environment: server
          game-versions: '1.21.1'
          java: '21'
          dependencies: |
            fabric-api(required){modrinth:fabric-api}{curseforge:fabric-api}
            fabric-language-kotlin(required){modrinth:fabric-language-kotlin}{curseforge:fabric-language-kotlin}
            fzzy-config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
          fail-mode: fail
